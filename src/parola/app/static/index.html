<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>P.A.R.O.L.A.</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <aside class="sidebar">
    <div class="side-top">
      <a href="#/" class="brand"><img src="/static/parola.png" alt="P.A.R.O.L.A." width="200" height="35"></a>
    </div>
    <div id="recorder" class="recorder"></div>
    <div class="search"><input id="search" type="search" placeholder="Cerca" autocomplete="off"></div>
    <nav id="calls" class="calls" aria-label="Registrazioni">
      <div id="pending" class="pending" role="status" hidden></div>
      <div id="list"></div>
    </nav>
  </aside>
  <main id="main" class="main"></main>
  <div id="audio" hidden></div>
  <div id="toast" class="toast" role="status"></div>
  <script src="/static/app.js"></script>
</body>
</html>
