# All hooks are local: they run the project's own tools via uv, so no hook
# repositories are fetched from the network.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types: [python]
      - id: no-media-files
        name: block audio/video files
        entry: Audio and video files must never be committed (see CLAUDE.md).
        language: fail
        files: '(?i)\.(wav|wave|mp3|m4a|mp4|m4v|mov|mkv|webm|avi|flac|ogg|oga|opus|aac|aif|aiff|caf|wma|amr|3gp)$'
      - id: no-private-data
        name: block data/ outside manifests
        entry: Only data/manifests/ may be committed; raw and private data stay local.
        language: fail
        files: '^data/(?!manifests/)'
      - id: no-large-files
        name: block files larger than 1 MB
        entry: uv run --frozen python scripts/check_file_size.py
        language: system
