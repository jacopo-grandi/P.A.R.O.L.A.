[project]
name = "parola"
version = "0.1.0"
description = "P.A.R.O.L.A.: local, word-for-word transcription of Italian/English audio and calls on Apple Silicon."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jacopo Grandi" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.143.2",
    "jiwer>=4.0.0",
    "mlx-whisper>=0.4",
    "num2words>=0.5.14",
    "numpy>=2",
    "parakeet-mlx>=0.5.3",
    "pydantic>=2.7",
    "python-docx>=1.2.0",
    "uvicorn>=0.54.0",
    "wordfreq>=3.1",
    # Telling voices apart (decision 0026); the core wheel holds onnxruntime and is not always
    # pulled in by sherpa-onnx itself.
    "sherpa-onnx>=1.13",
    "sherpa-onnx-core>=1.13",
    # Part-of-speech filter for the suggested titles (decision 0054). Both MIT; the Italian
    # tagger lives in the optional "titles" group, its license is non-commercial.
    "spacy>=3.8.18",
    "en-core-web-sm",
]

[project.scripts]
parola = "parola.cli:main"
# Old name, kept for a while: prints a notice, then runs parola (decision 0019).
ilat = "parola.cli:main_ilat"

[dependency-groups]
baselines = [
    "crisperwhisper[transformers]>=2.0.3",
]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=3.7",
    "pytest>=8",
    "ruff>=0.6",
]
# The Italian tagger for the suggested titles: CC BY-NC-SA 3.0 (non-commercial), so asked at
# install and never a default. Without it, Italian titles fall back to the frequency filters.
titles = [
    "it-core-news-sm",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parola"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "slow: runs the real ASR model (downloads weights on first run); select with -m slow",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
it-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/it_core_news_sm-3.8.0/it_core_news_sm-3.8.0-py3-none-any.whl" }
