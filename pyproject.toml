[project]
name = "ilat"
version = "0.1.0"
description = "Italian Audio Transcriptor: local, verbatim transcription of Italian/English audio and calls on Apple Silicon."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jacopo Grandi" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlx-whisper>=0.4",
    "pydantic>=2.7",
]

[project.scripts]
ilat = "ilat.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=3.7",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ilat"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "slow: runs the real ASR model (downloads weights on first run); select with -m slow",
]
